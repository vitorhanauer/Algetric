name: build-and-test
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Algetric.Desktop/Web/package-lock.json
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0 libproj25 proj-data libsecret-tools xvfb xauth libgl1-mesa-dri
      - run: npm ci --ignore-scripts --prefix src/Algetric.Desktop/Web
      - run: npm run build --prefix src/Algetric.Desktop/Web
      - run: npm test --prefix src/Algetric.Desktop/Web
      - run: dotnet restore Algetric.sln --locked-mode
      - run: dotnet build Algetric.sln --no-restore -c Release -m:1
      - run: dotnet test tests/Algetric.Tests --no-build -c Release
      - name: Real WebView and WebGL smoke test
        run: dbus-run-session -- xvfb-run -a dotnet run --project tests/Algetric.Smoke -c Release --no-build
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Publish Linux x64
        run: |
          dotnet publish src/Algetric.Desktop -c Release -r linux-x64 --self-contained true -p:RestoreLockedMode=true -o artifacts/linux-x64
          cp README.md THIRD_PARTY_NOTICES.md artifacts/linux-x64/
          cp -r docs artifacts/linux-x64/
          tar -czf artifacts/algetric-linux-x64.tar.gz -C artifacts/linux-x64 .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-build-and-smoke
          path: |
            artifacts/algetric-linux-x64.tar.gz
            artifacts/smoke/
