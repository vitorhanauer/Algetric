name: build-and-test
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Algetric.Desktop/Web/package-lock.json
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0 libproj25 proj-data libsecret-tools xvfb xauth libgl1-mesa-dri desktop-file-utils libglib2.0-bin python3
      - name: Desktop installation tests
        run: python3 -m unittest discover -s tests/installation -v
      - run: npm ci --ignore-scripts --prefix src/Algetric.Desktop/Web
      - run: npm run build --prefix src/Algetric.Desktop/Web
      - run: npm test --prefix src/Algetric.Desktop/Web
      - run: dotnet restore Algetric.sln --locked-mode
      - run: dotnet build Algetric.sln --no-restore -c Release -m:1
      - run: dotnet test tests/Algetric.Tests --no-build -c Release
      - name: Real WebView and WebGL smoke test
        run: dbus-run-session -- xvfb-run -a dotnet run --project tests/Algetric.Smoke -c Release --no-build
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Publish Linux x64
        run: |
          dotnet publish src/Algetric.Desktop -c Release -r linux-x64 --self-contained true -p:RestoreLockedMode=true -o artifacts/linux-x64
          bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-build-and-smoke
          path: |
            artifacts/algetric-linux-x64.tar.gz
            artifacts/algetric-linux-x64.tar.gz.sha256
            artifacts/smoke/
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Algetric.Desktop/Web/package-lock.json
      - name: Test Windows package scripts
        shell: pwsh
        run: |
          ./tests/windows/Packaging.Tests.ps1
          ./tests/windows/Update.Tests.ps1
      - name: Build pinned PROJ dependencies
        shell: pwsh
        run: |
          ./scripts/prepare-windows-native.ps1
          $native = (Resolve-Path artifacts/windows-native/x64-algetric-windows).Path
          "AlgetricProjRoot=$native" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish and test Windows application
        shell: pwsh
        run: ./scripts/publish-windows.ps1 -ProjRoot $env:AlgetricProjRoot
      - name: Ensure WebView2 Runtime
        shell: pwsh
        run: ./tests/windows/Ensure-WebView2.ps1
      - name: Test installation and uninstall
        shell: pwsh
        run: ./tests/windows/Installation.Tests.ps1
      - name: Real Windows WebView2 smoke test
        shell: pwsh
        env:
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: --use-angle=swiftshader --enable-unsafe-swiftshader
        run: |
          dotnet run --project tests/Algetric.Smoke -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Windows WebView2 smoke test failed.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-and-smoke
          path: |
            artifacts/algetric-win-x64.zip
            artifacts/algetric-win-x64.zip.sha256
            artifacts/smoke/
